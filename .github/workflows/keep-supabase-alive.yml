name: Keep Supabase Alive

on:
  schedule:
    # Runs every 3 days at 06:00 UTC (11:30 IST) — well within Supabase's 7-day inactivity pause window
    - cron: "0 6 */3 * *"
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

jobs:
  ping:
    name: Ping Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Ping production project
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Production ping status: $STATUS"
          [ "$STATUS" = "200" ] || [ "$STATUS" = "406" ] || exit 1
